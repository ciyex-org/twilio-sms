server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: twilio-sms
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/twilio_sms}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ciyex}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/ciyex/protocol/openid-connect/certs}

# JWT
jwt:
  secret: ${JWT_SECRET:default-secret-key-change-in-production-min-32-chars}

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Ciyex Platform SDK
ciyex:
  platform:
    api-url: ${CIYEX_API_URL:http://localhost:8080}

# Webhook base URL for Twilio status callbacks
webhook:
  base-url: ${WEBHOOK_BASE_URL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.ciyex.sms: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
